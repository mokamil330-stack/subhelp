<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Campaign – SubHelp</title>
  <meta name="description" content="Create a SubHelp funding campaign up to ₹5,000.">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #171717;
    }

    header {
      background: white;
      padding: 16px 6%;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #635bff;
    }

    .container {
      max-width: 650px;
      margin: 40px auto;
      padding: 0 18px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #eee;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 8px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #635bff;
    }

    .limit {
      background: #f1f0ff;
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
      color: #444;
      font-size: 14px;
    }

    .fee {
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
      background: #f7f7f7;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #635bff;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 18px;
      font-size: 13px;
      color: #777;
      line-height: 1.5;
      text-align: center;
    }

    .error {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #ffecec;
      color: #b00020;
      display: none;
      line-height: 1.4;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #635bff;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .box {
        padding: 22px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Sub<span>Help</span></div>
</header>

<div class="container">

  <div class="box">

    <h1>🆘 Create Your Campaign</h1>

    <p class="subtitle">
      Apni genuine zarurat ke liye campaign create karein.
      Maximum funding goal ₹5,000 hai.
    </p>

    <form id="campaignForm">

      <label for="title">Campaign Title</label>
      <input
        type="text"
        id="title"
        placeholder="Example: School Fee ke liye Help"
        maxlength="80"
        required
      >

      <label for="category">Category</label>

      <select id="category" required>
        <option value="">Select Category</option>
        <option>Education</option>
        <option>Emergency</option>
        <option>Food</option>
        <option>Family Support</option>
        <option>Travel Emergency</option>
        <option>Other</option>
      </select>

      <label for="amount">Funding Amount</label>

      <input
        type="number"
        id="amount"
        placeholder="Example: 1500"
        min="10"
        max="5000"
        required
      >

      <div class="limit">
        💡 Minimum ₹10 aur maximum ₹5,000.
      </div>

      <label for="description">Why do you need this help?</label>

      <textarea
        id="description"
        placeholder="Apni zarurat ko simple words mein explain karein..."
        maxlength="1000"
        required
      ></textarea>

      <label for="upi">Your UPI ID</label>

      <input
        type="text"
        id="upi"
        placeholder="example@upi"
        maxlength="100"
        required
      >

      <div class="fee">
        <span>Campaign Creation Fee</span>
        <span>₹19</span>
      </div>

      <button type="submit" id="submitBtn">
        Continue – ₹19
      </button>

      <div id="errorMessage" class="error"></div>

    </form>

    <p class="notice">
      Campaign live hone se pehle SubHelp verification process se guzrega.
    </p>

    <a href="dashboard.html" class="back">
      ← Back to Dashboard
    </a>

  </div>

</div>

<script>

  const campaignForm = document.getElementById("campaignForm");
  const submitBtn = document.getElementById("submitBtn");
  const errorMessage = document.getElementById("errorMessage");


  // Check login
  async function checkLogin() {

    const { data, error } =
      await window.supabaseClient.auth.getUser();

    if (error || !data.user) {
      window.location.href = "login.html";
      return false;
    }

    return true;
  }


  // Create campaign
  campaignForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    errorMessage.style.display = "none";
    errorMessage.textContent = "";

    const loggedIn = await checkLogin();

    if (!loggedIn) {
      return;
    }

    const title =
      document.getElementById("title").value.trim();

    const category =
      document.getElementById("category").value;

    const amount =
      Number(document.getElementById("amount").value);

    const description =
      document.getElementById("description").value.trim();

    const upi =
      document.getElementById("upi").value.trim();


    // Validation
    if (!title) {
      showError("Campaign title enter karein.");
      return;
    }

    if (!category) {
      showError("Category select karein.");
      return;
    }

    if (!amount || amount < 10 || amount > 5000) {
      showError("Funding amount ₹10 se ₹5,000 ke beech hona chahiye.");
      return;
    }

    if (!description) {
      showError("Apni need ka reason enter karein.");
      return;
    }

    if (!upi) {
      showError("UPI ID enter karein.");
      return;
    }


    submitBtn.disabled = true;
    submitBtn.textContent = "Campaign save ho rahi hai...";


    // Current user
    const { data: userData, error: userError } =
      await window.supabaseClient.auth.getUser();

    if (userError || !userData.user) {

      showError("Login session expire ho gayi. Dobara login karein.");

      submitBtn.disabled = false;
      submitBtn.textContent = "Continue – ₹19";

      return;
    }


    const user = userData.user;


    // Save campaign in Supabase
    const { data: campaign, error } =
      await window.supabaseClient
        .from("campaigns")
        .insert({
          user_id: user.id,
          title: title,
          category: category,
          description: description,
          goal_amount: amount,
          upi_id: upi,
          status: "pending"
        })
        .select()
        .single();


    if (error) {

      showError(
        "Campaign save nahi ho saki: " + error.message
      );

      submitBtn.disabled = false;
      submitBtn.textContent = "Continue – ₹19";

      return;
    }


    // Campaign successfully saved
    // Payment page ko campaign ID bhej rahe hain
    const paymentUrl =
      "payment.html?campaign_id=" +
      encodeURIComponent(campaign.id) +
      "&title=" +
      encodeURIComponent(title) +
      "&amount=" +
      encodeURIComponent(amount);


    window.location.href = paymentUrl;

  });


  function showError(message) {

    errorMessage.textContent = "❌ " + message;
    errorMessage.style.display = "block";

  }


  // Run login check when page opens
  checkLogin();

</script>

</body>
</html>
