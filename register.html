<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account – SubHelp</title>
  <meta name="description" content="Create your SubHelp account and start a funding campaign.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #171717;
    }

    header {
      background: white;
      padding: 16px 6%;
      border-bottom: 1px solid #eee;
    }

    .logo { font-size: 25px; font-weight: 800; }
    .logo span { color: #635bff; }

    .container {
      max-width: 500px;
      margin: 45px auto;
      padding: 0 18px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #eee;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-size: 29px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 17px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #635bff;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #635bff;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .login a {
      color: #635bff;
      font-weight: 700;
      text-decoration: none;
    }

    .terms {
      margin-top: 15px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .ref-note {
      display: none;
      margin-top: 8px;
      color: #176b36;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Sub<span>Help</span></div>
</header>

<div class="container">
  <div class="box">

    <h1>👤 Create Account</h1>

    <p class="subtitle">
      SubHelp par account banayein aur apni genuine need ke liye campaign create karein.
    </p>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Your full name" required>

      <label for="phone">Mobile Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="10 digit mobile number"
        maxlength="10"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Minimum 6 characters"
        minlength="6"
        required
      >

      <label for="referral">Referral Code (Optional)</label>
      <input
        type="text"
        id="referral"
        placeholder="Enter referral code"
        maxlength="20"
      >

      <div id="refNote" class="ref-note">
        🎁 Referral code automatically added.
      </div>

      <button type="submit" id="registerBtn">
        Create Account
      </button>

    </form>

    <div class="message" id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <p class="terms">
      Account create karke aap SubHelp ke applicable Terms aur Privacy Policy
      ko accept karte hain.
    </p>

  </div>
</div>

<script>
const form = document.getElementById("registerForm");
const button = document.getElementById("registerBtn");
const message = document.getElementById("message");
const referralInput = document.getElementById("referral");
const refNote = document.getElementById("refNote");

// Referral link example:
// register.html?ref=SHA8BB0073
const urlParams = new URLSearchParams(window.location.search);
const referralFromUrl = (urlParams.get("ref") || "").trim();

if (referralFromUrl) {
  referralInput.value = referralFromUrl.toUpperCase();
  refNote.style.display = "block";
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const referral = referralInput.value.trim().toUpperCase();

  if (phone.length !== 10 || !/^[0-9]+$/.test(phone)) {
    showMessage("Valid 10 digit mobile number enter karein.", false);
    return;
  }

  if (password.length < 6) {
    showMessage("Password minimum 6 characters ka hona chahiye.", false);
    return;
  }

  button.disabled = true;
  button.textContent = "Creating Account...";

  try {
    const { data, error } =
      await window.supabaseClient.auth.signUp({
        email: email,
        password: password,

        options: {
          data: {
            full_name: name,
            phone: phone,

            // Referral code is saved in auth metadata.
            // Supabase profile trigger will use this to set referred_by.
            referral_code_used: referral || null
          }
        }
      });

    if (error) {
      throw error;
    }

    showMessage(
      "🎉 Account successfully create ho gaya! Apne email inbox mein verification link check karein.",
      true
    );

    form.reset();

    // Keep referral code visible after reset if the signup came
    // from a referral link.
    if (referralFromUrl) {
      referralInput.value = referralFromUrl.toUpperCase();
      refNote.style.display = "block";
    }

  } catch (error) {
    console.error(error);

    showMessage(
      "Account create nahi ho saka: " + error.message,
      false
    );

  } finally {
    button.disabled = false;
    button.textContent = "Create Account";
  }
});

function showMessage(text, success) {
  message.style.display = "block";
  message.textContent = text;

  if (success) {
    message.style.background = "#e8f7ee";
    message.style.color = "#176b36";
  } else {
    message.style.background = "#fff0f0";
    message.style.color = "#b42318";
  }
}
</script>

</body>
</html>
