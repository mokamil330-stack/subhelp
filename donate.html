<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Donate – SubHelp</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #171717;
    }

    header {
      background: white;
      padding: 16px 6%;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
    }

    .logo span {
      color: #635bff;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #635bff;
      text-decoration: none;
      font-weight: 700;
    }

    .card {
      background: white;
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 25px;
    }

    .category {
      display: inline-block;
      background: #f1f0ff;
      color: #635bff;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .description {
      color: #666;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .collected {
      font-weight: 800;
    }

    .goal {
      color: #666;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #e8e8e8;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 100%;
      background: #635bff;
      border-radius: 20px;
    }

    .donate-box {
      background: #f8f8ff;
      border-radius: 15px;
      padding: 20px;
    }

    .donate-box h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .donate-box p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .amount-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .amount-button {
      padding: 13px 8px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .amount-button:hover {
      border-color: #635bff;
    }

    .amount-button.selected {
      background: #635bff;
      color: white;
      border-color: #635bff;
    }

    .custom-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .custom-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    .custom-input:focus {
      border-color: #635bff;
    }

    .donate-button {
      width: 100%;
      border: none;
      background: #635bff;
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .donate-button:hover {
      opacity: 0.9;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: 700;
      line-height: 1.5;
    }

    .loading,
    .error {
      background: white;
      border: 1px solid #eee;
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      color: #666;
      line-height: 1.6;
    }

    .error {
      background: #fff0f0;
      color: #b00020;
    }

    .notice {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 500px) {

      .card {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .amount-buttons {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    Sub<span>Help</span>
  </div>
</header>


<div class="container">

  <a href="campaigns.html" class="back">
    ← Back to Campaigns
  </a>


  <div id="content">

    <div class="loading">
      Campaign details load ho rahi hain...
    </div>

  </div>

</div>


<script>

  // -----------------------------------------
  // GET CAMPAIGN ID
  // -----------------------------------------

  const params =
    new URLSearchParams(window.location.search);

  const campaignId =
    params.get("id");


  const content =
    document.getElementById("content");


  let selectedAmount = 0;

  let campaignGoal = 0;

  let campaignCollected = 0;


  // -----------------------------------------
  // ESCAPE HTML
  // -----------------------------------------

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // -----------------------------------------
  // LOAD CAMPAIGN
  // -----------------------------------------

  async function loadCampaign() {

    if (!campaignId) {

      content.innerHTML = `
        <div class="error">
          ❌ Campaign ID nahi mili.
        </div>
      `;

      return;
    }


    if (!window.supabaseClient) {

      content.innerHTML = `
        <div class="error">
          ❌ Supabase load nahi hua.
          <br><br>
          Page refresh karke dobara try karein.
        </div>
      `;

      return;
    }


    const {
      data: campaign,
      error
    } =
      await window.supabaseClient
        .from("campaigns")
        .select(`
          id,
          title,
          category,
          description,
          goal_amount,
          collected_amount,
          status
        `)
        .eq("id", campaignId)
        .eq("status", "approved")
        .single();


    if (error || !campaign) {

      console.error(
        "Campaign error:",
        error
      );

      content.innerHTML = `
        <div class="error">
          ❌ Campaign available nahi hai.
        </div>
      `;

      return;
    }


    campaignGoal =
      Number(campaign.goal_amount || 0);

    campaignCollected =
      Number(campaign.collected_amount || 0);


    let percentage = 0;

    if (campaignGoal > 0) {

      percentage =
        Math.round(
          (campaignCollected / campaignGoal) * 100
        );

    }

    percentage =
      Math.min(percentage, 100);


    const remaining =
      Math.max(
        campaignGoal - campaignCollected,
        0
      );


    // ---------------------------------------
    // SHOW DONATION PAGE
    // ---------------------------------------

    content.innerHTML = `

      <div class="card">

        <div class="category">
          ${escapeHtml(campaign.category)}
        </div>

        <h1>
          ${escapeHtml(campaign.title)}
        </h1>

        <div class="description">
          ${escapeHtml(campaign.description)}
        </div>


        <div class="progress-info">

          <span class="collected">
            ₹${campaignCollected.toLocaleString("en-IN")} collected
          </span>

          <span class="goal">
            Goal ₹${campaignGoal.toLocaleString("en-IN")}
          </span>

        </div>


        <div class="progress">

          <div
            class="progress-bar"
            style="width:${percentage}%"
          ></div>

        </div>


        <div class="donate-box">

          <h2>
            ❤️ Donate
          </h2>

          <p>
            Aap kitni madad karna chahte hain?
          </p>


          <div class="amount-buttons">

            <button
              class="amount-button"
              onclick="selectAmount(10, this)"
            >
              ₹10
            </button>

            <button
              class="amount-button"
              onclick="selectAmount(50, this)"
            >
              ₹50
            </button>

            <button
              class="amount-button"
              onclick="selectAmount(100, this)"
            >
              ₹100
            </button>

            <button
              class="amount-button"
              onclick="selectAmount(500, this)"
            >
              ₹500
            </button>

          </div>


          <label class="custom-label">
            Ya apni amount enter karein
          </label>

          <input
            type="number"
            id="customAmount"
            class="custom-input"
            placeholder="₹ Amount"
            min="1"
            step="1"
            oninput="customAmountChanged()"
          >


          <button
            class="donate-button"
            onclick="startDonation()"
          >
            ❤️ Donate Now
          </button>


          <div
            id="message"
            class="message"
          ></div>


          <div class="notice">
            Payment system secure verification ke baad
            donation ko campaign mein record karega.
          </div>

        </div>

      </div>

    `;

  }


  // -----------------------------------------
  // SELECT PRESET AMOUNT
  // -----------------------------------------

  function selectAmount(
    amount,
    button
  ) {

    selectedAmount =
      Number(amount);


    document
      .querySelectorAll(".amount-button")
      .forEach(btn => {
        btn.classList.remove("selected");
      });


    button.classList.add("selected");


    const input =
      document.getElementById("customAmount");


    if (input) {
      input.value = "";
    }

  }


  // -----------------------------------------
  // CUSTOM AMOUNT
  // -----------------------------------------

  function customAmountChanged() {

    const input =
      document.getElementById("customAmount");


    selectedAmount =
      Number(input.value || 0);


    document
      .querySelectorAll(".amount-button")
      .forEach(btn => {
        btn.classList.remove("selected");
      });

  }


  // -----------------------------------------
  // START DONATION
  // -----------------------------------------

  function startDonation() {

    const message =
      document.getElementById("message");


    let amount =
      Number(selectedAmount);


    const customInput =
      document.getElementById("customAmount");


    if (
      customInput &&
      customInput.value
    ) {

      amount =
        Number(customInput.value);

    }


    // ---------------------------------------
    // VALIDATION
    // ---------------------------------------

    if (!amount || amount < 1) {

      message.style.color =
        "#b00020";

      message.textContent =
        "❌ Please donation amount select karein.";

      return;
    }


    if (!Number.isFinite(amount)) {

      message.style.color =
        "#b00020";

      message.textContent =
        "❌ Invalid amount.";

      return;
    }


    if (amount > 5000) {

      message.style.color =
        "#b00020";

      message.textContent =
        "❌ Maximum donation amount ₹5,000 hai.";

      return;
    }


    if (
      campaignGoal > 0 &&
      campaignCollected >= campaignGoal
    ) {

      message.style.color =
        "#b00020";

      message.textContent =
        "❌ Ye campaign apna goal complete kar chuki hai.";

      return;
    }


    const remaining =
      Math.max(
        campaignGoal - campaignCollected,
        0
      );


    if (
      remaining > 0 &&
      amount > remaining
    ) {

      message.style.color =
        "#b00020";

      message.textContent =
        "❌ Is campaign ko abhi maximum ₹" +
        remaining.toLocaleString("en-IN") +
        " ki zarurat hai.";

      return;
    }


    // ---------------------------------------
    // TEMPORARY
    // ---------------------------------------

    message.style.color =
      "#635bff";

    message.textContent =
      "⏳ Donation payment system connect kiya jayega. Selected amount: ₹" +
      amount.toLocaleString("en-IN");

  }


  // -----------------------------------------
  // LOAD
  // -----------------------------------------

  loadCampaign();

</script>

</body>
</html>
